<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FraudGuard — Review Queue</title><style>
:root{--bg:#f5f6fa;--panel:#fff;--ink:#172033;--muted:#778198;--line:#e7eaf1;--nav:#111827;--green:#159570;--amber:#c78312;--red:#d64545;--shadow:0 14px 40px rgba(20,28,50,.07)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.top{height:70px;background:var(--nav);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 5%}.brand{font-weight:800;display:flex;gap:10px;align-items:center}.mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#756cff,#4f46e5);display:grid;place-items:center}.mark svg{width:19px}.back{color:#aeb7c8;text-decoration:none;font-size:11px}.wrap{width:min(1400px,94%);margin:34px auto}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}.head h1{margin:0 0 6px;font-size:27px;letter-spacing:-.7px}.head p{margin:0;color:var(--muted);font-size:12px}.live{background:#fff5df;color:var(--amber);padding:8px 11px;border-radius:8px;font-size:10px;font-weight:800}.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}.toolbar{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;gap:9px;align-items:center;flex-wrap:wrap}.search,.select{height:36px;border:1px solid var(--line);border-radius:8px;background:#fbfcfe;padding:0 10px;font-size:11px;color:var(--ink)}.search{width:260px}.select{width:165px}.refresh{margin-left:auto;height:36px;border:0;border-radius:8px;background:#f0f1f6;color:#505a70;font-size:11px;font-weight:800;padding:0 13px;cursor:pointer}.table-scroll{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:1120px}.table th{background:#fafbfc;color:#929aac;text-align:left;text-transform:uppercase;font-size:9px;letter-spacing:.6px;padding:12px 17px}.table td{border-top:1px solid var(--line);padding:14px 17px;font-size:11px;white-space:nowrap}.id{font-weight:800;color:#35405a}.amount{font-weight:800}.badge{display:inline-block;padding:5px 8px;border-radius:6px;font-size:9px;font-weight:800}.review{background:#fff5df;color:var(--amber)}.paid{background:#e8f8f2;color:var(--green)}.payment{background:#eeedff;color:#554dd4}.failed,.rejected{background:#ffebeb;color:var(--red)}.pending{background:#f0f1f6;color:#68738a}.high{color:var(--red)}.medium{color:var(--amber)}.low{color:var(--green)}.btn{height:31px;border:0;border-radius:7px;padding:0 10px;font-size:10px;font-weight:800;cursor:pointer}.inspect{background:#eeedff;color:#554dd4}.empty{padding:55px;text-align:center;color:var(--muted);font-size:12px}.error{padding:18px;color:var(--red);font-size:11px}.modal{position:fixed;inset:0;background:rgba(15,20,32,.5);display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.dialog{width:min(700px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:15px;box-shadow:0 30px 80px rgba(0,0,0,.2)}.dialog-head{padding:20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.dialog-head h2{margin:0;font-size:16px}.close{border:0;background:none;font-size:20px;color:var(--muted);cursor:pointer}.details{padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.fact{background:#f8f9fc;border-radius:9px;padding:12px}.fact small{display:block;color:var(--muted);font-size:9px;margin-bottom:5px}.fact strong{font-size:12px}.signals{grid-column:1/-1}.signal{background:#fff5df;color:#73510d;border:1px solid #f1dfb5;border-radius:8px;padding:10px;font-size:10px;margin:7px 0}.decision{padding:18px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}.approve,.reject{border:0;border-radius:8px;height:40px;padding:0 15px;font-size:11px;font-weight:800;cursor:pointer}.approve{background:var(--green);color:#fff}.reject{background:#ffebeb;color:var(--red)}.decision button:disabled{opacity:.55}@media(max-width:650px){.head{display:block}.live{display:inline-block;margin-top:12px}.details{grid-template-columns:1fr}.signals{grid-column:auto}.refresh{margin-left:0}.search{width:100%}}
</style></head><body><header class="top"><div class="brand"><div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3l7 3v5c0 4.7-3 8.3-7 10-4-1.7-7-5.3-7-10V6l7-3z"/><path d="M9 12l2 2 4-5"/></svg></div>FraudGuard</div><a class="back" href="/dashboard">← Operations dashboard</a></header><main class="wrap"><div class="head"><div><h1>Manual review queue</h1><p>Investigate medium-risk orders before payment is released.</p></div><div class="live">REVIEW REQUIRED</div></div><section class="card"><div class="toolbar"><input class="search" id="search" placeholder="Search order, transaction, customer or email"><select class="select" id="status"><option value="REVIEW">Review only</option><option value="">All orders</option><option value="APPROVED">Approved</option><option value="REJECTED">Rejected</option><option value="PAYMENT_INITIALIZED">Payment initialized</option><option value="PAID">Paid</option><option value="FAILED">Failed</option></select><button class="refresh" id="refresh">Refresh queue</button></div><div class="table-scroll"><table class="table"><thead><tr><th>Order</th><th>Transaction</th><th>Customer</th><th>Amount</th><th>Risk</th><th>Order status</th><th>Payment</th><th>Signals</th><th>Action</th></tr></thead><tbody id="rows"><tr><td colspan="9" class="empty">Loading review queue…</td></tr></tbody></table></div></section></main><div class="modal" id="modal"><div class="dialog"><div class="dialog-head"><h2>Review transaction</h2><button class="close" id="close">×</button></div><div class="details" id="details"></div><div class="decision"><button class="reject" id="reject">Reject order</button><button class="approve" id="approve">Approve & continue to payment</button></div></div></div><script>
let orders=[],selected=null;const rows=document.getElementById('rows'),modal=document.getElementById('modal'),details=document.getElementById('details');
const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
function money(v,c='NGN'){try{return new Intl.NumberFormat('en-NG',{style:'currency',currency:c||'NGN',maximumFractionDigits:2}).format(Number(v)||0)}catch{return 'NGN '+(Number(v)||0).toFixed(2)}}
function badgeClass(status){return ({PAID:'paid',PAYMENT_INITIALIZED:'payment',FAILED:'failed',REJECTED:'rejected',PENDING:'pending',REVIEW:'review',APPROVED:'payment'})[status]||'pending'}
async function load(){rows.innerHTML='<tr><td colspan="9" class="empty">Loading review queue…</td></tr>';try{const r=await fetch('/ecommerce/orders?limit=100&status='+encodeURIComponent(document.getElementById('status').value));const d=await r.json();if(!r.ok)throw Error(d.detail||'Unable to load orders');orders=d.orders||[];render()}catch(e){rows.innerHTML='<tr><td colspan="9" class="error">'+esc(e.message)+'</td></tr>'}}
function render(){const q=document.getElementById('search').value.trim().toLowerCase();const list=orders.filter(o=>!q||[o.order_id,o.transaction_id,o.user_id,o.email,o.name].some(v=>String(v||'').toLowerCase().includes(q)));if(!list.length){rows.innerHTML='<tr><td colspan="9" class="empty">No matching orders.</td></tr>';return}rows.innerHTML=list.map(o=>'<tr><td class="id">'+esc(o.order_id)+'</td><td class="id">'+esc(o.transaction_id)+'</td><td>'+esc(o.name||o.email||o.user_id)+'</td><td class="amount">'+money(o.amount,o.currency)+'</td><td><span class="badge review">'+esc(o.risk_decision||'UNKNOWN')+'</span> <strong class="'+(o.risk_score>=70?'high':o.risk_score>=30?'medium':'low')+'">'+esc(o.risk_score)+'/100</strong></td><td><span class="badge '+badgeClass(o.status)+'">'+esc(o.status)+'</span></td><td><span class="badge '+badgeClass(o.payment_status)+'">'+esc(o.payment_status||'PENDING')+'</span></td><td>'+esc((o.risk_reasons||[]).length)+' signal(s)</td><td><button class="btn inspect" onclick="openReview(\''+encodeURIComponent(o.order_id)+'\')">Inspect</button></td></tr>').join('')}
window.openReview=id=>{selected=orders.find(o=>o.order_id===decodeURIComponent(id));if(!selected)return;details.innerHTML='<div class="fact"><small>Order ID</small><strong>'+esc(selected.order_id)+'</strong></div><div class="fact"><small>Transaction ID</small><strong>'+esc(selected.transaction_id)+'</strong></div><div class="fact"><small>Customer</small><strong>'+esc(selected.name||selected.email||selected.user_id)+'</strong></div><div class="fact"><small>Amount</small><strong>'+money(selected.amount,selected.currency)+'</strong></div><div class="fact"><small>Risk score</small><strong>'+esc(selected.risk_score)+'/100 · '+esc(selected.risk_level)+'</strong></div><div class="fact"><small>Order status</small><strong>'+esc(selected.status)+'</strong></div><div class="fact"><small>Payment status</small><strong>'+esc(selected.payment_status||'PENDING')+'</strong></div><div class="fact"><small>Last updated</small><strong>'+esc(selected.updated_at?new Date(selected.updated_at).toLocaleString():'—')+'</strong></div><div class="signals"><small style="color:#778198">Risk signals</small>'+(selected.risk_reasons||[]).map(x=>'<div class="signal">'+esc(x)+'</div>').join('')+'</div>';modal.classList.add('show');const canAct=selected.status==='REVIEW';document.getElementById('approve').disabled=!canAct;document.getElementById('reject').disabled=!canAct};
async function action(type){if(!selected||selected.status!=='REVIEW')return;const b=type==='approve'?document.getElementById('approve'):document.getElementById('reject');b.disabled=true;b.textContent='Processing…';try{const key=prompt('Enter admin API key to authorize this action:');if(!key)throw Error('Admin action cancelled');const r=await fetch('/ecommerce/admin/orders/'+encodeURIComponent(selected.order_id)+'/'+type,{method:'POST',headers:{'X-Admin-API-Key':key}});const d=await r.json();if(!r.ok)throw Error(d.detail||'Action failed');modal.classList.remove('show');if(type==='approve'&&d.payment_link)window.open(d.payment_link,'_blank','noopener');await load()}catch(e){alert(e.message)}finally{b.disabled=false;b.textContent=type==='approve'?'Approve & continue to payment':'Reject order'}}
document.getElementById('approve').onclick=()=>action('approve');document.getElementById('reject').onclick=()=>action('reject');document.getElementById('close').onclick=()=>modal.classList.remove('show');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('show')};document.getElementById('refresh').onclick=load;document.getElementById('status').onchange=load;document.getElementById('search').oninput=render;load();
</script></body></html>
